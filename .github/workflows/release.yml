name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2

      - name: Check the tag matches the manifest and changelog
        run: node scripts/release.mjs verify "$GITHUB_REF_NAME"

      - name: Run unit tests
        run: npm test

      - name: Build the extension zip
        run: node scripts/release.mjs package

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/signalbox-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
