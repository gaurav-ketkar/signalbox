name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check the tag matches the manifest and changelog
        run: node scripts/release.mjs verify "$GITHUB_REF_NAME"

      - name: Run unit tests
        run: npm test

      - name: Build the extension zip
        run: node scripts/release.mjs package

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/signalbox-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
